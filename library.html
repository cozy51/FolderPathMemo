<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FolderPath Memo — 一覧</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="icons/icon.svg" alt="" /><div><h1>FolderPath Memo</h1><p>フォルダー一覧</p></div></div>
      <div class="summary"><strong id="visibleCount">0</strong><span>件を表示</span></div>
    </header>
    <main>
      <section class="controls">
        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="フォルダ名・メモ・パス・タグを検索" autofocus /></label>
        <select id="viewSelect" aria-label="表示条件"><option value="all">すべて</option><option value="favorite">お気に入り</option><option value="history">履歴</option></select>
      </section>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="star-col">★</th><th>フォルダ名 / メモ</th><th>タグ</th><th>パス</th><th class="action-col">操作</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty" hidden>条件に合うフォルダーがありません。</div>
      </div>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="library.js"></script>
  </body>
</html>
