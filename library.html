<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FolderPath Memo — 一覧</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="icons/icon.svg" alt="" /><div><h1>FolderPath Memo</h1><p>フォルダー一覧 <span id="appVersion" class="version-badge">v1.3.6</span></p></div></div>
      <div class="header-actions"><button id="importButton" class="ghost-button" type="button">インポート</button><div class="backup-control"><button id="exportButton" class="ghost-button" type="button">バックアップ</button><span id="backupChangeCount" class="change-badge" title="前回バックアップからの変更件数">0</span></div><button id="addButton" class="primary-button" type="button">＋ 新規登録</button><input id="importInput" type="file" accept="application/json,.json" hidden /></div>
    </header>
    <main>
      <section class="controls">
        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="フォルダ名・メモ・パス・タグを検索" autofocus /></label>
        <div class="view-tabs" role="tablist"><button class="view-tab active" data-view="all" type="button">すべて <span id="allCount">0</span></button><button class="view-tab" data-view="favorite" type="button">★ お気に入り <span id="favoriteCount">0</span></button><button class="view-tab" data-view="history" type="button">履歴 <span id="historyCount">0</span></button></div>
      </section>
      <div id="tagFilters" class="tag-filters" aria-label="タグフィルター"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="star-col">★</th><th>フォルダ名 / メモ</th><th>タグ</th><th>パス</th><th class="action-col">操作</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty" hidden>条件に合うフォルダーがありません。</div>
      </div>
    </main>
    <dialog id="pathDialog">
      <form id="pathForm" method="dialog">
        <div class="dialog-header"><div><p>FOLDER DETAILS</p><h2 id="dialogTitle">フォルダーを登録</h2></div><button id="closeDialog" class="close-button" type="button">×</button></div>
        <input id="itemId" type="hidden" />
        <label>フォルダーパス <em>必須</em><input id="pathInput" required maxlength="500" /></label>
        <label>フォルダ名 <small class="auto-label">自動入力</small><input id="nameInput" maxlength="80" placeholder="パスから自動入力されます" /></label>
        <p class="auto-name-hint">フォルダーパスを入力すると、最後のフォルダ名を自動で入れます。必要な場合だけ手入力で変更できます。</p>
        <label>メモ <small>用途などを自由に記入</small><textarea id="memoInput" maxlength="300" rows="3"></textarea></label>
        <label>タグ <small>カンマ区切り</small><input id="tagsInput" maxlength="200" /></label>
        <section class="file-list-editor" aria-label="ファイルリスト">
          <div class="file-list-editor-header"><span>ファイルリスト</span><small>ファイル名とメモを登録</small></div>
          <div id="fileRows" class="file-rows"></div>
          <button id="addFileButton" class="add-file-button" type="button">＋ ファイルを追加</button>
        </section>
        <label class="favorite-check"><input id="favoriteInput" type="checkbox" /> ★ お気に入りに追加</label>
        <div class="dialog-actions"><button id="cancelButton" class="ghost-button" type="button">キャンセル</button><button class="primary-button" type="submit">保存する</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script src="library.js"></script>
  </body>
</html>
