<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FolderPath Memo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 6.8A1.8 1.8 0 0 1 4.8 5h5l2 2H19a2 2 0 0 1 2 2v8.2a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 17.2V6.8Z"/></svg>
          </div>
          <div><h1>FolderPath</h1><p>大切な場所へ、すぐに。</p></div>
        </div>
        <button id="addButton" class="primary-button" type="button"><span>＋</span> 新規登録</button>
      </header>

      <section class="search-area" aria-label="検索と絞り込み">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="フォルダ名・メモ・パス・タグをあいまい検索" />
          <kbd>Ctrl K</kbd>
        </label>
        <div id="tagFilters" class="tag-filters" aria-label="タグフィルター"></div>
      </section>

      <section class="toolbar">
        <div class="view-tabs" role="tablist" aria-label="表示切り替え">
          <button class="view-tab active" data-view="all" role="tab" type="button">すべて <span id="allCount">0</span></button>
          <button class="view-tab" data-view="favorite" role="tab" type="button">★ お気に入り <span id="favoriteCount">0</span></button>
        </div>
        <div class="backup-actions">
          <button id="importButton" class="text-button" type="button">インポート</button>
          <button id="exportButton" class="text-button" type="button">バックアップ</button>
          <input id="importInput" type="file" accept="application/json,.json" hidden />
        </div>
      </section>

      <section id="list" class="path-list" aria-live="polite"></section>

      <footer><span id="statusText">ローカルに安全に保存されます</span><span>FolderPath Memo v1.0</span></footer>
    </main>

    <dialog id="pathDialog">
      <form id="pathForm" method="dialog">
        <div class="dialog-header"><div><p class="eyebrow">FOLDER DETAILS</p><h2 id="dialogTitle">フォルダーを登録</h2></div><button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button></div>
        <input id="itemId" type="hidden" />
        <label>フォルダ名 <small>未入力ならパスから自動取得</small><input id="nameInput" maxlength="80" placeholder="例：プロジェクト資料" /></label>
        <label>フォルダーパス <span>必須</span><input id="pathInput" required maxlength="500" placeholder="例：C:\Users\me\Documents" /></label>
        <label>メモ <small>用途などを自由に記入</small><textarea id="memoInput" maxlength="300" rows="3" placeholder="例：月次報告書と関連資料の保存先"></textarea></label>
        <label>タグ <small>カンマ区切り</small><input id="tagsInput" maxlength="200" placeholder="例：仕事, 重要" /></label>
        <label class="favorite-check"><input id="favoriteInput" type="checkbox" /> <span>★ お気に入りに追加</span></label>
        <div class="dialog-actions"><button id="cancelButton" class="secondary-button" type="button">キャンセル</button><button class="primary-button" type="submit">保存する</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <template id="itemTemplate">
      <article class="path-card">
        <button class="favorite-button" type="button" aria-label="お気に入り切り替え">★</button>
        <div class="path-main"><div class="path-title-row"><h3></h3><div class="card-tags"></div></div><p class="path-memo"></p><button class="path-value" type="button" title="クリックしてコピー"></button></div>
        <div class="card-actions">
          <button class="copy-button action-button" type="button"><span>▣</span> コピー</button>
          <button class="open-button action-button strong" type="button"><span>↗</span> 開く</button>
          <button class="more-button icon-button" type="button" aria-label="編集メニュー">•••</button>
          <div class="card-menu"><button class="edit-button" type="button">編集</button><button class="delete-button danger" type="button">削除</button></div>
        </div>
      </article>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
